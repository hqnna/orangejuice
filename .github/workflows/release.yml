# Builds the release artifact and publishes the release the tag names.
#
# `git push origin v0.1.0` is the whole trigger. The tag's own annotated
# message is the release summary — what a release is for lives with the thing
# it describes — and the commit list is generated here, so the notes are
# reproducible from the tag alone.
name: release

on:
  push:
    tags:
      - "v*"
  # For trying the build without cutting a release: publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One job per platform orangejuice is both a host and a target for
  # (`docs/spec.md` §2.1). Each builds its own artifact and checks it on the
  # machine it is for — a cross-built tarball nobody ran is not a release.
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      # A platform that fails should not cancel the others: which ones broke is
      # the useful answer.
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-latest
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
          - platform: aarch64-macos
            runner: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          # The notes come from the tag's message and the whole history behind
          # it, so neither may be shallow.
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # A release that does not pass its own gate is not a release. This is the
      # same `nix flake check` the repository is developed against: clippy,
      # fmt, doc, and the whole test suite including the acceptance examples.
      - name: Check
        run: nix flake check --print-build-logs

      - name: Build the portable distribution
        run: nix build .#portable --print-build-logs

      # `result` is a symlink into the store and the store is read-only, so the
      # asset is copied out for `gh` to upload as a plain file.
      - name: Stage the artifact
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist
          for archive in result/*.tar.zst; do
            [ -L "$archive" ] && continue
            cp -L "$archive" dist/
          done
          chmod u+w dist/*
          ls -l dist
          echo "name=$(cd dist && echo *.tar.zst)" >> "$GITHUB_OUTPUT"

      # What a downloader gets, so that a truncated transfer is visible. Run
      # from the dev shell: a macOS runner has `shasum` where Linux has
      # `sha256sum`, and the release is one file of checksums either way.
      - name: Checksum
        run: |
          set -euo pipefail
          nix develop --command \
            sh -c 'cd dist && sha256sum ./*.tar.zst > SHA256SUMS'
          cat dist/SHA256SUMS

      # The artifact is unpacked and run the way a downloader would. `env -i`
      # on the first of the two is the whole point of the portable build: on
      # Linux the tree carries its own loader and libraries, on macOS the
      # libraries nix built, and either way it has to start with nothing set.
      #
      # `zstd` comes from the dev shell because macOS `tar --zstd` shells out
      # to a `zstd` the runner does not have; the compiler under test does not,
      # since what is being tested is that it needs nothing.
      - name: Smoke-test the artifact
        env:
          ARCHIVE: ${{ steps.stage.outputs.name }}
        run: |
          set -euo pipefail
          # `$1`/`$2` are the inner `sh`'s, which is the point of passing them.
          # shellcheck disable=SC2016
          nix develop --command \
            sh -c 'zstd -dc "$1" | tar -xf - -C "$2"' sh "dist/$ARCHIVE" "$RUNNER_TEMP"
          root="$RUNNER_TEMP/${ARCHIVE%.tar.zst}"
          env -i "$root/bin/oj" -- version
          # Then a whole build, with the runner's environment: linking drives
          # the platform C compiler (**C§11**), so this one needs a `PATH`.
          # What it must *not* need is `CC` — a machine without it used to
          # abort inside the `cc` crate rather than find a driver.
          printf '#import "Basic";\nmain :: () { print("release artifact works\\n"); }\n' > "$RUNNER_TEMP/hello.jai"
          unset CC
          cd "$RUNNER_TEMP" && "$root/bin/oj" hello.jai -quiet -- run

      - uses: actions/upload-artifact@v4
        with:
          name: orangejuice-portable-${{ matrix.platform }}
          path: dist/*

  # The release itself, once every platform has built and checked its own
  # artifact. Notes come from the tag's message; the assets come from the jobs
  # above.
  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: orangejuice-portable-*
          path: downloaded

      # Each job contributed its own tarball and its own SHA256SUMS; the
      # release carries one of each tarball and one combined checksum file.
      - name: Gather the artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find downloaded -name '*.tar.zst' -exec cp {} dist/ \;
          (cd dist && sha256sum ./*.tar.zst | tee SHA256SUMS)
          ls -l dist

      - name: Assemble the release notes
        run: |
          set -euo pipefail
          # `%(contents)` carries the signature of a signed tag, which is not
          # part of what the release has to say.
          summary=$(
            git tag --list "$GITHUB_REF_NAME" --format='%(contents)' \
              | sed '/^-----BEGIN \(SSH\|PGP\) SIGNATURE-----$/,$d'
          )
          # What changed since the release before this one. The first release
          # has nothing behind it, so it lists everything.
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range="$GITHUB_REF_NAME"
          if [ -n "$previous" ]; then
            range="$previous..$GITHUB_REF_NAME"
            echo "changes since $previous"
          fi
          # A command substitution drops the trailing newlines, which is what
          # keeps a blank line out of the bottom of the code block.
          commits=$(
            git shortlog --pretty --reverse "$range" \
              | sed -e 's/      //g' -e '/^[^ ].*([0-9][0-9]*):$/d' \
              | sed '/./,$!d'
          )
          {
            printf '%s\n\n' "$summary"
            echo '## Commits'
            echo
            echo '```'
            printf '%s\n' "$commits"
            echo '```'
          } > notes.md
          head -20 notes.md

      # A release published by hand keeps its own notes: this fills in only
      # what is missing, and always attaches the build.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file notes.md \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
